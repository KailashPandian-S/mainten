<!DOCTYPE html>
<html>

<head>

    <title>Mainten Register</title>
    <link rel="stylesheet" href="C:\Users\kaila\Desktop\Mainten\front end\css\registerorg.css">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" integrity="sha384-JcKb8q3iqJ61gNV9KGb8thSsNjpSL0n8PARn9HuZOnIxN0hoP+VmmDGMN5t9UJ0Z" crossorigin="anonymous" />
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js" integrity="sha384-B4gt1jrGC7Jh4AgTPSdUtOBvfO8shuf57BaghqFfPlYxofvL8/KUEfYiJOMMV+rV" crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">



</head>

<body>
    <div class="register-org-page mt-4">
        <h1 class="text-center org-reg-main-text">Get your org account!</h1>
        <div class="d-flex flex-row justify-content-center">
            <div class="register-card text-center shadow-lg">
                <h1 class="register-text">Register</h1>
                <input type="text" id="orgId" class="input-login-page" placeholder="organisation mail id" />
                <p class="error-message text-left ml-4 pl-3" id="IdErrorMessage"></p>
                <input type="password" id="orgPass" class="input-login-page" placeholder="organisation key" />
                <div class = "d-flex flex-row mt-2">
                    <p class="error-message text-left ml-4 pl-3 mt-0 error-message-pass" id="passErrorMessage"></p>
                </div>
                <input type="password" id="orgPassConfirmation" class="input-login-page" placeholder="confirm organisation key" />
                <div class = "d-flex flex-row mt-2">
                    <p class="error-message text-left ml-4 pl-3 mt-0 error-message-pass" id="passConfirmationErrorMessage"></p>
                    <a id="passShowHide" class="show-pass">show password</a>
                </div>
                
                
                <p class="error-message d-none" id="errorMessage"></p>
                <button class="btn btn-success login-button" id="accessBtn">create</button>
                <div class="register-anchor-container text-center">
                    <a href="C:\Users\kaila\Desktop\Mainten\front end\pages\index.html">login?</a>
                </div>
            </div>
        </div>

    </div>


    <script src="C:\Users\kaila\Desktop\Mainten\front end\js\registerorg.js"></script>
</body>

</html>
