    <title>Mainten Login</title>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js" integrity="sha384-B4gt1jrGC7Jh4AgTPSdUtOBvfO8shuf57BaghqFfPlYxofvL8/KUEfYiJOMMV+rV" crossorigin="anonymous"></script>

</head>

<body>
    <div class="landing-page mt-4">
        <h1 class="text-center welcome-text">login as admin</h1>
        <div class="d-flex flex-row justify-content-center">
            <div class="register-card text-center shadow-lg">
                <h1 class="login-text">login</h1>
                <input type="text" id="orgId" class="input-login-page" placeholder="mail id" />
                <p class="error-message text-left ml-4 pl-3" id="IdErrorMessage"></p>
                <input type="password" id="orgPass" class="input-login-page" placeholder="password" />
                <div class = "d-flex flex-row mt-2">
                    <p class="error-message text-left ml-4 pl-3 mt-0 error-message-pass" id="passErrorMessage"></p>
                    <a id="passShowHide" class="show-pass">show password</a>
                </div>
                
                
                <p class="error-message d-none" id="errorMessage">invalid credentials</p>
                <button class="btn btn-success login-button" id="accessBtn">login</button>



            </div>
        </div>

    </div>


    <script src="C:\Users\kaila\Desktop\Mainten\front end\js\adminlogin.js"></script>
</body>
